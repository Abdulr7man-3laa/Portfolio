<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="linq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B35D8"/>
      <stop offset="100%" stop-color="#4C23BA"/>
    </linearGradient>
  </defs>
  <!-- Background squircle matching .NET & EF Core -->
  <rect width="128" height="128" rx="26" fill="url(#linq-grad)"/>
  
  <!-- Subtle query loop / connection arc -->
  <path d="M 28 88 C 28 94, 100 94, 100 88" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="28" cy="88" r="3.5" fill="#C4B5FD"/>
  <circle cx="100" cy="88" r="3.5" fill="#C4B5FD"/>

  <!-- Bold Crisp "LINQ" Wordmark -->
  <text x="64" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">LINQ</text>
  
  <!-- Lambda / Query symbol indicator -->
  <path d="M 46 80 L 52 74 M 52 74 L 56 80 M 52 74 L 52 70" stroke="#E9D5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#DDD6FE" letter-spacing="1">QUERY</text>
</svg>
